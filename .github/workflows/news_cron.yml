name: 국방·방산 뉴스 자동 알림 (24/7 Webhook)

on:
  schedule:
    # 30분마다 자동 실행 (UTC 기준: 매시 0분, 30분)
    - cron: '*/30 * * * *'
  # GitHub Actions 탭에서 수동 실행(Run workflow) 버튼 제공
  workflow_dispatch:

permissions:
  contents: write

jobs:
  broadcast_news:
    name: 뉴스 수집 및 디스코드 전송
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 국방·방산 뉴스 수집 및 웹훅 발송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CUSTOM_KEYWORDS: ${{ secrets.CUSTOM_KEYWORDS }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          python webhook_cron.py

      - name: 전송 이력 DB 갱신 및 커밋 (중복 방지용)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update sent news db cache [skip ci]"
          file_pattern: "data/news.db"
